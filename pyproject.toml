[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voucher-reorder"
version = "0.1.0"
description = "Reorder voucher check sections for QuickBooks Desktop"
requires-python = ">=3.11"
dependencies = ["pypdf==6.9.1"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["voucher_reorder*"]

[project.scripts]
voucher-reorder = "voucher_reorder.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
