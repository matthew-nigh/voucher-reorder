name: Test and build Windows installer
on:
  pull_request:
  push:
    branches: [main, codex/windows-test-fixes]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - name: Install Windows acceptance test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install packaging tools
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Load x64 Visual Studio compiler environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -DevCmdArguments "-arch=x64 -host_arch=x64" -SkipAutomaticLocation
          foreach ($name in 'PATH','INCLUDE','LIB','LIBPATH') {
            "${name}=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: Check Windows PowerShell syntax
        shell: powershell
        run: |
          Get-ChildItem packaging/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Build installer and corresponding source
        run: python scripts/build_windows.py
      - name: Smoke test the bundled Windows runtime and Ghostscript
        run: |
          & build/windows/runtime/python.exe scripts/smoke_packaged.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check settings preview, DPI scaling, PDF output and asynchronous setup
        shell: powershell
        timeout-minutes: 3
        run: scripts/test_settings.ps1
      - name: Upload settings preview captures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Settings-previews
          path: build/settings-previews/*.png
          if-no-files-found: ignore
      - name: Print a synthetic batch to a Windows file port
        shell: powershell
        timeout-minutes: 8
        run: scripts/test_print_pages.ps1
      - name: Exercise optional virtual printer setup logic
        timeout-minutes: 2
        shell: powershell
        run: scripts/test_virtual_setup.ps1
      - name: Check out the actual v0.2.0 upgrade baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: cdf7427c2f8ba9a48945f2d22a46c0014a082d21
          path: upgrade-baseline
      - name: Build v0.2.0 baseline installer for upgrade tests
        id: upgrade
        run: |
          Copy-Item downloads upgrade-baseline/downloads -Recurse
          python upgrade-baseline/scripts/build_windows.py
      - name: Exercise integrated provisioning, version checks and uninstall
        shell: powershell
        timeout-minutes: 6
        run: scripts/test_provisioning.ps1 -Installer upgrade-baseline/dist/VoucherReorder-0.2.0-Setup.exe -UpgradeInstaller dist/VoucherReorder-0.2.1-Setup.exe
      - name: Install and upgrade in a real standard-user account
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        shell: powershell
        timeout-minutes: 6
        run: scripts/test_standard_user.ps1 -Installer upgrade-baseline/dist/VoucherReorder-0.2.0-Setup.exe -UpgradeInstaller dist/VoucherReorder-0.2.1-Setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoucherReorder-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: VoucherReorder-windows-x64
          path: dist
      - name: Attach installer, sources and checksums to the tag's Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Voucher Reorder $RELEASE_TAG" --notes "Unsigned Windows x64 installer. Download the matching source archive and checksums. Complete TESTING_ON_WINDOWS.md on plain paper before using check stock."
          fi
