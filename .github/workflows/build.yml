name: Test and build Windows installer
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install packaging tools
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Check Windows PowerShell syntax
        shell: powershell
        run: |
          Get-ChildItem packaging/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Build installer and corresponding source
        run: python scripts/build_windows.py
      - name: Smoke test the bundled Windows runtime and Ghostscript
        run: |
          & build/windows/runtime/python.exe scripts/smoke_packaged.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise optional virtual printer setup logic
        shell: powershell
        run: scripts/test_virtual_setup.ps1
      - name: Build upgrade-test installer
        run: python scripts/build_windows.py --version 0.2.1
      - name: Install and upgrade in a real standard-user account
        shell: powershell
        timeout-minutes: 6
        run: scripts/test_standard_user.ps1 -Installer dist/VoucherReorder-0.2.0-Setup.exe -UpgradeInstaller dist/VoucherReorder-0.2.1-Setup.exe
      - name: Remove upgrade-test artifacts
        run: |
          Remove-Item dist/*0.2.1*
          python -c "import hashlib,pathlib; p=pathlib.Path('dist'); (p/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(p.iterdir()) if f.suffix in ('.exe','.zip')))"
      - uses: actions/upload-artifact@v4
        with:
          name: VoucherReorder-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VoucherReorder-windows-x64
          path: dist
      - name: Attach installer, sources and checksums to the tag's Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Voucher Reorder $RELEASE_TAG" --notes "Unsigned Windows x64 installer. Download the matching source archive and checksums. Complete TESTING_ON_WINDOWS.md on plain paper before using check stock."
          fi
